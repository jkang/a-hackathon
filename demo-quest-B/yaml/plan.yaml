# Quest B · PLAN / CREATIVE gate capture
# Human-led, AI-scaffolded. Offering = membership design + founding-member offer.
quest: B
seed_insight: "Pandas are Earth's most beloved IP, but the Base captures almost none of that love beyond the ¥55 gate. Turn 'the world's most famous zoo' into a global membership brand built on belonging."
audience: {primary_segment: "Panda Parents", job_to_be_done: "protectiveness + belonging"}
scenario:
  - {moment: "The 2 a.m. clip", time: "always-on virality", place: "TikTok / Reels",     event: "a panda clip goes viral → join CTA"}
  - {moment: "Birthday livestream", time: "annual",         place: "live cams + social",  event: "members-only birthday party"}
  - {moment: "Holiday gifting",     time: "Q4 season",      place: "global store",        event: "founding-kit gift drop"}
creative_brief: "for Panda Parents whose emotional job is protectiveness, at the moment a panda clip goes viral, we offer founding membership — so they adopt and belong."
hmw: "How might we turn millions of panda viewers into paying members who feel they belong, at the moment a clip goes viral?"
ideas:
  - {author: "Mei",    concept: "PANDA PASSPORT — a global membership"}
  - {author: "Kenji",  concept: "Adopt-a-Panda — named adoption tiers"}
  - {author: "Rina",   concept: "Founding 100,000 — numbered founders"}
  - {author: "Budi",   concept: "Panda Cam+ — 24/7 live cams for members"}
  - {author: "Sari",   concept: "A global licensed merch store"}
  - {author: "Grace",  concept: "English-first content engine"}
  - {author: "Nina",   concept: "Turn Fu Bao's Korea fanbase into members"}
  - {author: "Lucas",  concept: "Conservation impact tracker — see your impact"}
  - {author: "Aisha",  concept: "Arabic / Indonesian localized feeds"}
  - {author: "Tan",    concept: "Panda birthday live events"}
  - {author: "Budi",   concept: "Digital collectible passport stamps"}
  - {author: "Mei",    concept: "Member-only behind-the-scenes"}
votes: {panda_passport: 7, adopt_a_panda: 5, founding_100k: 4, panda_cam: 3, global_store: 2}
winner:
  concept: "PANDA PASSPORT — a global membership built on belonging, not a ticket"
  proposition: "Members adopt a panda, get live cams and member-only content, a welcome kit, and a founding badge — with conservation framed at the centre."
  name: "PANDA PASSPORT"
  slogan: "One bear. One world. One membership."
  moment: "the 2 a.m. clip that goes viral — the second a viewer wants to belong"
offering:
  type: membership
  tiers:
    - "Panda Pal (Free) — newsletter, digital badge, public content"
    - "Founding Member ($30/yr) — live cams, adoption certificate, 10% merch, Founder badge"
    - "Patron ($120/yr) — all of the above + welcome kit, priority experiences"
  founding_offer: "Founding 100,000 — the first 100,000 members get a numbered digital passport, an adoption certificate and a welcome kit at $30/yr, with a 'Founder' badge for life."
pilot:
  markets: ["Japan", "Indonesia"]
  duration: "3 months"
  success_criteria: "Member conversion ≥3% and CAC ≤$8 across both markets, with no metric hitting No-Go."
experiment:
  hypothesis: "If we launch Founding 100,000 with localized content + live cams in Japan & Indonesia, member conversion reaches ≥3% and CAC ≤$8 — predicting the 1M-member / 12-month goal."
  treatment: "Founding-member campaign: live cams, adoption certificates, localized content, global store soft-launch — in Japan & Indonesia."
  control: "Held-out baseline market (Brazil, public content only)."
  measurement_setup: "Sign-up funnel + UTM tracking weekly; creator dashboards; merch sell-through; member cohort tracker; mid-point review at T-6 weeks."
budget:
  total: 1100000
  allocation:
    - {market: "Japan",     channel: "Paid social",  tactic: "Creator + fan-community seeding", amount: 200000}
    - {market: "Japan",     channel: "Partnership",  tactic: "Retail / merch co-op",             amount: 150000}
    - {market: "Indonesia", channel: "Paid social",  tactic: "Creator-led membership drive",     amount: 250000}
    - {market: "Indonesia", channel: "Partnership",  tactic: "Telco + ecommerce distribution",   amount: 150000}
    - {market: "Global",    channel: "Content",      tactic: "English-first content engine",      amount: 200000}
    - {market: "Global",    channel: "Merch",        tactic: "Founding welcome-kit production",   amount: 100000}
    - {market: "Global",    channel: "Measurement",  tactic: "Analytics + attribution",           amount:  50000}
