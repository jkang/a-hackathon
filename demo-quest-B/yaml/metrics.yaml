# Quest B · PROVE gate capture
# Human-led, AI-scaffolded. Metrics and thresholds chosen by the team; benchmark-defended.
quest: B
victory_conditions:
  - "International visitor share 12% (from ~5%) → 1M+ overseas visitors/yr"
  - "1M members in 12 months (20% overseas, 30% repeat-visit)"
  - "$28M annual international licensing & merch revenue"
  - "10M followers across TikTok / IG / YouTube"
  - "Non-ticket on-site spend $6 → $15 per visitor"
metrics:
  - name: "Member conversion rate"
    formula: "paid members / landing-page visits"
    benchmark_ref: "Card goal: 1M members in 12 months"
    target: "4.0%"
    threshold_go: "≥3.0%"
    threshold_no_go: "<1.5%"
  - name: "CAC per member"
    formula: "paid spend / paid members"
    benchmark_ref: "Fu Bao 2.7M merch units — proven monetizable fandom"
    target: "≤$6"
    threshold_go: "≤$8"
    threshold_no_go: ">$12"
  - name: "Merch sell-through"
    formula: "units sold / units stocked"
    benchmark_ref: "Fu Bao merch: 2.7M units, +60%"
    target: "12%"
    threshold_go: "≥10%"
    threshold_no_go: "<5%"
  - name: "Organic reach (3-month)"
    formula: "net new TikTok/IG/YouTube followers"
    benchmark_ref: "Card goal: 10M followers"
    target: "2.0M"
    threshold_go: "≥1.5M"
    threshold_no_go: "<0.8M"
  - name: "Overseas member share"
    formula: "overseas members / total members"
    benchmark_ref: "Card goal: 20% overseas"
    target: "20%"
    threshold_go: "≥15%"
    threshold_no_go: "<8%"
