<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · Storyboard (16:9)</title>
<style>
  /* ---- Storyboard surfaces ---------------------------------------------------------
     The board itself is one inline SVG (generated by scripts/build-storyboard.py).
     These vars theme the *viewer*; the script injects the campaign palette on <body>.
     Surfaces are NOT fixed — the AI sets `theme` (light/dark + palette) from the campaign plan. */
  :root{
    --ascentium-midnight:#0F1514; --ascentium-orange:#FF6611;
    --sb-page:#F1ECE2; --sb-deck:#FBF8F2; --sb-card:#FFFFFF; --sb-line:#E3DCCE;
    --sb-title:#16130D; --sb-text:#4A463D; --sb-muted:#8B8574;
    --accent:#FF6611; --accent-tint:#FFF0E7; --accent-line:#FFD1B8; --accent-deep:#B24000;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--sb-page);overflow:hidden;
    font-family:"Poppins","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--sb-title);}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 10%, var(--sb-page)) 0%, var(--sb-page) 62%);}
  .deck{width:1280px;height:720px;position:relative;background:var(--sb-deck);border:1px solid var(--sb-line);border-radius:14px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.22);transform-origin:center center;flex:none;}
  .slide{position:absolute;inset:0;padding:26px 34px 34px;display:flex;flex-direction:column;}
  .brandbar{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:9px;flex:none;}
  .logo{font-weight:800;font-size:18px;color:var(--sb-title);} .logo span{color:var(--accent);}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:11px;flex:none;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--sb-title);}
  .range{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .boardbox{flex:1;min-height:0;margin-top:14px;display:flex;align-items:center;justify-content:center;}
  .boardbox svg.sheet{display:block;max-width:100%;max-height:100%;width:auto;height:auto;
    border:1px solid var(--sb-line);border-radius:14px;box-shadow:0 18px 46px rgba(0,0,0,.16);background:var(--sb-deck);}
  .boardbox img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:var(--sb-deck);
    border:1px solid var(--sb-line);border-radius:14px;box-shadow:0 18px 46px rgba(0,0,0,.16);}
  .hint{position:absolute;bottom:12px;left:34px;font-size:10px;color:var(--sb-muted);letter-spacing:.04em;}
  .upgrade{position:absolute;bottom:10px;right:34px;}
  .upgrade button{font:inherit;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--accent);
    background:transparent;border:1px solid var(--accent-line);border-radius:999px;padding:6px 14px;cursor:pointer;letter-spacing:.04em;}
  .upgrade button:hover{background:var(--accent-tint);}
  /* embedded mode (?embed=1) — hide our own chrome so the host deck shows just the sheet */
  body.embed .hint,body.embed .upgrade{display:none;}
  /* prompt overlay (kept dark for contrast on any surface) */
  .poverlay{position:absolute;inset:0;background:rgba(6,10,10,.92);backdrop-filter:blur(6px);z-index:5;
    display:none;flex-direction:column;padding:34px 42px;}
  .poverlay.on{display:flex;}
  .poverlay .ph{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:2px solid var(--accent);padding-bottom:9px;}
  .poverlay h2{font-size:19px;font-weight:800;color:#F4EFE4;}
  .poverlay .pclose{font:inherit;font-family:inherit;font-size:12px;font-weight:700;color:#F4EFE4;background:transparent;border:1px solid #2B3A38;border-radius:8px;padding:5px 12px;cursor:pointer;}
  .poverlay .note{font-size:12px;color:#8FA8A3;margin-top:9px;line-height:1.5;}
  .poverlay .promptbox{position:relative;margin-top:11px;flex:1;min-height:0;overflow:auto;background:#070D0D;border:1px solid #22312F;border-radius:12px;padding:15px 17px;}
  .poverlay pre{white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;color:#C7D4D1;}
  .poverlay .copy{position:absolute;top:11px;right:11px;font:inherit;font-family:inherit;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;}
  @media print{ @page{size:A4 landscape;margin:6mm;} html,body{background:var(--sb-deck);overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .stage{position:static;display:block;} .deck{width:100%;height:auto;box-shadow:none;border-radius:0;}
    .hint,.upgrade,.poverlay{display:none!important;} }
</style>
</head>
<body data-quest="{{QUEST}}" data-surface="{{SURFACE}}" style="--accent:{{ACCENT}};--accent-tint:{{ACCENT_TINT}};--accent-line:{{ACCENT_LINE}};--accent-deep:{{ACCENT_DEEP}};--sb-page:{{PAGE}};--sb-deck:{{CARD}};--sb-card:{{CARD}};--sb-line:{{LINE}};--sb-title:{{TITLE_C}};--sb-text:{{TEXT}};--sb-muted:{{MUTED}};">
<div class="stage"><div class="deck" id="deck">
{{SLIDES}}
  <div class="hint">F fullscreen · print = one landscape page</div>
  <div class="upgrade"><button id="upBtn">Get a richer sheet ↗</button></div>
  <div class="poverlay" id="poverlay">{{PROMPT_OVERLAY}}</div>
</div></div>
<script>
(function(){
  var deck=document.getElementById('deck');
  function fit(){ var s=Math.min(window.innerWidth/1280, window.innerHeight/720); deck.style.transform='scale('+s+')'; }
  if(/[?&]embed\b/.test(location.search)) document.body.classList.add('embed');
  var ov=document.getElementById('poverlay');
  var up=document.getElementById('upBtn');
  function toggle(force){ if(!ov) return; var on=(typeof force==='boolean')?force:!ov.classList.contains('on'); ov.classList.toggle('on', on); }
  if(up) up.addEventListener('click', function(){ toggle(true); });
  if(ov){ ov.addEventListener('click', function(e){ if(e.target===ov) toggle(false); }); }
  var closeBtn=document.getElementById('pclose'); if(closeBtn) closeBtn.addEventListener('click', function(){ toggle(false); });
  var copyBtn=document.getElementById('pcopy');
  if(copyBtn) copyBtn.addEventListener('click', function(){
    var pre=document.getElementById('pprompt'); if(!pre) return;
    var t=pre.innerText;
    function done(){ copyBtn.textContent='Copied'; setTimeout(function(){ copyBtn.textContent='Copy prompt'; }, 1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done); }
    else { var r=document.createRange(); r.selectNodeContents(pre); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); done(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();} else {document.exitFullscreen&&document.exitFullscreen();} }
    else if((e.key==='p'||e.key==='P')){ toggle(); }
    else if(e.key==='Escape'){ toggle(false); }
  });
  window.addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
