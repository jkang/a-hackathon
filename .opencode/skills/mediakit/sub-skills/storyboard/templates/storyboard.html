<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · Storyboard</title>
<style>
  /* ---- Storyboard viewer ------------------------------------------------------------
     A 16:9 paginated deck. Each page carries 1–2 rich SCENE cards
     (number · title · scene art · phone/UI inset · customer quote · meta · action).
     Surfaces are NOT fixed — the AI sets `theme` (light/dark + palette) from the campaign plan.
     Accent + tint are injected from the quest card (see quest-card.md). */
  :root{
    --ascentium-midnight:#0F1514; --ascentium-orange:#FF6611;
    --sb-page:#F1ECE2; --sb-deck:#FBF8F2; --sb-card:#FFFFFF; --sb-line:#E3DCCE;
    --sb-title:#16130D; --sb-text:#4A463D; --sb-muted:#8B8574; --sb-faint:#B3AC9C;
    --accent:#FF6611; --accent-tint:#FFF0E7; --accent-line:#FFD1B8; --accent-deep:#B24000;
    --sb-radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--sb-page);overflow:hidden;
    font-family:"Poppins","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--sb-title);}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 12%, var(--sb-page)) 0%, var(--sb-page) 64%);}
  .deck{width:1280px;height:720px;position:relative;background:var(--sb-deck);border:1px solid var(--sb-line);
    border-radius:var(--sb-radius);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.24);transform-origin:center center;flex:none;}

  /* ---- slides ---- */
  .slide{position:absolute;inset:0;padding:22px 30px 20px;display:none;flex-direction:column;}
  .slide.on{display:flex;}
  .brandbar{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:8px;flex:none;}
  .logo{font-weight:800;font-size:17px;color:var(--sb-title);} .logo span{color:var(--accent);}
  .tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:9px;flex:none;}
  h1{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--sb-title);}
  h1 em{font-style:normal;color:var(--accent);}
  .range{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}

  /* ---- cover ---- */
  .cover{padding:30px 46px 22px;}
  .cover .brandbar{border-bottom-width:3px;padding-bottom:10px;}
  .coverbody{flex:1;min-height:0;display:grid;grid-template-columns:1.02fr .98fr;gap:30px;align-items:center;margin-top:10px;}
  .coverhero{border-radius:14px;overflow:hidden;border:1px solid var(--sb-line);background:var(--sb-page);aspect-ratio:800/420;}
  .coverhero svg{display:block;width:100%;height:100%;}
  .coverfacts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;flex:none;}
  .cfact{border:1px solid var(--sb-line);border-radius:11px;background:var(--sb-card);padding:10px 14px;}
  .cfact .n{font-size:23px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.01em;}
  .cfact .c{font-size:9.5px;line-height:1.4;color:var(--sb-muted);margin-top:5px;font-weight:600;}
  .cover .kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);}
  .cover .confname{font-size:54px;font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-top:8px;}
  .cover .coslogan{font-size:19px;font-weight:700;color:var(--accent-deep);margin-top:10px;}
  .cover .premise{font-size:13px;line-height:1.62;color:var(--sb-text);margin-top:12px;}
  .arcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;flex:none;}
  .arcch{border:1px solid var(--sb-line);border-radius:12px;padding:14px 16px;background:var(--sb-card);}
  .arcch .rn{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.1em;}
  .arcch b{display:block;font-size:15px;font-weight:800;margin-top:2px;}
  .arcch .sc{font-size:10.5px;font-weight:700;color:var(--sb-muted);margin-top:4px;letter-spacing:.05em;}
  .arcch p{font-size:11.5px;line-height:1.5;color:var(--sb-text);margin-top:7px;}
  .covernote{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:10.5px;color:var(--sb-muted);letter-spacing:.05em;}
  .covernote b{color:var(--accent);font-weight:800;}

  /* ---- cards row ---- */
  .cards{flex:1;min-height:0;margin-top:12px;display:grid;gap:14px;}
  .cards.two{grid-template-columns:1fr 1fr;}
  .cards.one{grid-template-columns:1fr;}
  .scene{border:1px solid var(--sb-line);border-radius:12px;background:var(--sb-card);display:flex;flex-direction:column;overflow:hidden;min-width:0;}
  .cards.one .scene{display:grid;grid-template-columns:1.34fr 1fr;}

  .shead{display:flex;align-items:flex-start;gap:11px;padding:11px 14px 9px;flex:none;}
  .snum{flex:none;width:32px;height:23px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
  .stitle{min-width:0;}
  .stitle h3{font-size:14.5px;font-weight:800;line-height:1.22;letter-spacing:-.01em;}
  .stag{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-muted);margin-top:3px;display:block;}
  .cards.one .stitle h3{font-size:22px;line-height:1.18;}

  .sart{position:relative;margin:0 12px;border-radius:10px;overflow:hidden;aspect-ratio:800/420;flex:none;background:var(--sb-page);}
  .cards.one .sart{margin:20px;border-radius:12px;aspect-ratio:800/420;height:auto;align-self:center;flex:none;}
  .sart svg{display:block;width:100%;height:100%;}
  .sceneline{margin:8px 14px 0;font-size:10px;line-height:1.45;color:var(--sb-muted);font-style:italic;}

  .phone{position:absolute;right:9px;bottom:9px;width:132px;background:var(--sb-card);border:1px solid var(--sb-line);
    border-radius:12px;padding:9px 10px 8px;box-shadow:0 10px 26px rgba(0,0,0,.28);}
  .phone .pl{font-size:7.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  .phone .pt{font-size:10.5px;font-weight:800;line-height:1.25;margin-top:3px;color:var(--sb-title);}
  .phone .px{font-size:8px;line-height:1.45;color:var(--sb-text);margin-top:4px;}
  .phone .pc{display:block;margin-top:7px;background:var(--accent);color:#fff;font-size:8px;font-weight:800;text-align:center;
    border-radius:7px;padding:5px 0;letter-spacing:.04em;}

  .quote{margin:9px 14px 0;background:var(--accent-tint);border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.45;
    font-style:italic;color:var(--accent-deep);}
  .cards.one .quote{margin:0;font-size:13px;padding:11px 13px;border-radius:10px;}

  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px 0;flex:none;}
  .cards.one .meta{grid-template-columns:1fr 1fr;gap:10px 14px;padding:0;}
  .meta div{min-width:0;}
  .meta dt{font-size:7.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-muted);}
  .meta dd{font-size:10px;font-weight:700;line-height:1.35;color:var(--sb-title);margin-top:2px;}
  .cards.one .meta dd{font-size:11.5px;}

  .saction{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--sb-line);}
  .saction .act{font-size:9.5px;font-weight:800;color:var(--accent-deep);letter-spacing:.04em;}
  .saction .src{font-size:8.5px;color:var(--sb-muted);text-align:right;}
  .cards.one .saction{padding:11px 14px;}

  /* right column when one-per-page */
  .ctext{display:flex;flex-direction:column;min-width:0;}
  .ctext .inner{padding:22px 24px 0;display:flex;flex-direction:column;gap:13px;flex:1;min-height:0;overflow:hidden;justify-content:center;}

  /* ---- board / richer-board page ---- */
  .boardbox{flex:1;min-height:0;margin-top:12px;display:flex;align-items:center;justify-content:center;}
  .boardbox img{display:block;max-width:100%;max-height:100%;background:var(--sb-card);border:1px solid var(--sb-line);border-radius:12px;}
  .boardbox iframe{width:100%;height:100%;border:1px solid var(--sb-line);border-radius:12px;background:var(--sb-card);}

  /* ---- pager rail ---- */
  .rail{position:absolute;bottom:6px;left:30px;right:30px;display:flex;align-items:center;gap:10px;flex:none;height:14px;}
  .dots{display:flex;gap:5px;align-items:center;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sb-line);border:none;padding:0;cursor:pointer;transition:transform .15s;}
  .dot.on{background:var(--accent);transform:scale(1.25);}
  .rail .cnt{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--sb-muted);margin-left:2px;}
  .rail .spacer{flex:1;}
  .navbtn{font:inherit;font-family:inherit;font-size:10px;font-weight:800;color:var(--accent);background:transparent;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;cursor:pointer;letter-spacing:.04em;}
  .navbtn:hover{background:var(--accent-tint);}
  .navbtn[disabled]{opacity:.35;cursor:default;}
  .hint{font-size:9.5px;color:var(--sb-muted);letter-spacing:.04em;}
  .upgrade button{font:inherit;font-family:inherit;font-size:9.5px;font-weight:700;color:var(--accent);
    background:transparent;border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;cursor:pointer;letter-spacing:.04em;}
  .upgrade button:hover{background:var(--accent-tint);}

  /* click zones */
  .zone{position:absolute;top:52px;bottom:26px;width:9%;z-index:2;cursor:pointer;border:none;background:transparent;}
  .zone.prev{left:0;} .zone.next{right:0;}
  .zone:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent);}

  /* embedded mode (?embed=1) — the host deck shows the pages; keep paging, hide the outer chrome */
  body.embed .hint,body.embed .upgrade{display:none;}
  body.embed .deck{border-radius:0;border:none;box-shadow:none;}

  /* prompt overlay */
  .poverlay{position:absolute;inset:0;background:rgba(6,10,10,.93);backdrop-filter:blur(6px);z-index:6;
    display:none;flex-direction:column;padding:30px 40px;}
  .poverlay.on{display:flex;}
  .poverlay .ph{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:2px solid var(--accent);padding-bottom:8px;}
  .poverlay h2{font-size:18px;font-weight:800;color:#F4EFE4;}
  .poverlay .pclose{font:inherit;font-family:inherit;font-size:12px;font-weight:700;color:#F4EFE4;background:transparent;border:1px solid #2B3A38;border-radius:8px;padding:5px 12px;cursor:pointer;}
  .poverlay .note{font-size:12px;color:#8FA8A3;margin-top:8px;line-height:1.5;}
  .poverlay .promptbox{position:relative;margin-top:10px;flex:1;min-height:0;overflow:auto;background:#070D0D;border:1px solid #22312F;border-radius:12px;padding:14px 16px;}
  .poverlay pre{white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;color:#C7D4D1;}
  .poverlay .copy{position:absolute;top:10px;right:10px;font:inherit;font-family:inherit;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;}

  @media print{
    @page{size:A4 landscape;margin:6mm;}
    html,body{background:var(--sb-deck);overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .stage{position:static;display:block;background:none;}
    .deck{width:100%;height:auto;box-shadow:none;border-radius:0;border:none;}
    .slide{position:relative;inset:auto;display:flex!important;height:96vh;page-break-after:always;break-after:page;}
    .rail,.poverlay,.zone{display:none!important;}
  }
</style>
</head>
<body data-quest="{{QUEST}}" data-surface="{{SURFACE}}" data-perpage="{{PERPAGE}}" style="--accent:{{ACCENT}};--accent-tint:{{ACCENT_TINT}};--accent-line:{{ACCENT_LINE}};--accent-deep:{{ACCENT_DEEP}};--sb-page:{{PAGE}};--sb-deck:{{CARD}};--sb-card:{{CARD}};--sb-line:{{LINE}};--sb-title:{{TITLE_C}};--sb-text:{{TEXT}};--sb-muted:{{MUTED}};">
<div class="stage"><div class="deck" id="deck">
{{SLIDES}}
  <button class="zone prev" id="zprev" aria-label="Previous page"></button>
  <button class="zone next" id="znext" aria-label="Next page"></button>
  <div class="rail">
    <div class="dots" id="dots"></div>
    <div class="cnt" id="cnt"></div>
    <div class="spacer"></div>
    <div class="hint">← / → to page · F fullscreen · P richer script · print = one page per scene</div>
    <div class="upgrade"><button id="upBtn">Write a richer story script ↗</button></div>
  </div>
  <div class="poverlay" id="poverlay">{{PROMPT_OVERLAY}}</div>
</div></div>
<script>
(function(){
  var deck=document.getElementById('deck');
  var pages=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var dotsBox=document.getElementById('dots');
  var cnt=document.getElementById('cnt');
  var i=0;
  function fit(){ var s=Math.min(window.innerWidth/1280, window.innerHeight/720); deck.style.transform='scale('+s+')'; }
  function show(n){
    i=Math.max(0,Math.min(pages.length-1,n));
    pages.forEach(function(p,k){ p.classList.toggle('on',k===i); });
    Array.prototype.forEach.call(dotsBox.children,function(d,k){ d.classList.toggle('on',k===i); });
    cnt.textContent='PAGE '+(i+1)+' / '+pages.length;
    var zp=document.getElementById('zprev'), zn=document.getElementById('znext');
    if(zp) zp.style.visibility=(i===0)?'hidden':'visible';
    if(zn) zn.style.visibility=(i===pages.length-1)?'hidden':'visible';
  }
  if(dotsBox) pages.forEach(function(p,k){
    var b=document.createElement('button'); b.className='dot'; b.setAttribute('aria-label','Go to page '+(k+1));
    b.addEventListener('click',function(){ show(k); }); dotsBox.appendChild(b);
  });
  if(/[?&]embed\b/.test(location.search)) document.body.classList.add('embed');
  var mp=(location.search.match(/[?&]page=(\d+)/)); if(mp) i=Math.max(0,parseInt(mp[1],10)-1);
  var ov=document.getElementById('poverlay');
  var up=document.getElementById('upBtn');
  function toggle(force){ if(!ov) return; var on=(typeof force==='boolean')?force:!ov.classList.contains('on'); ov.classList.toggle('on',on); }
  if(up) up.addEventListener('click',function(){ toggle(true); });
  if(ov) ov.addEventListener('click',function(e){ if(e.target===ov) toggle(false); });
  var cb=document.getElementById('pclose'); if(cb) cb.addEventListener('click',function(){ toggle(false); });
  var copyBtn=document.getElementById('pcopy');
  if(copyBtn) copyBtn.addEventListener('click',function(){
    var pre=document.getElementById('pprompt'); if(!pre) return;
    var t=pre.innerText;
    function done(){ copyBtn.textContent='Copied'; setTimeout(function(){ copyBtn.textContent='Copy prompt'; },1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done); }
    else { var r=document.createRange(); r.selectNodeContents(pre); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); done(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ show(i+1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ show(i-1); e.preventDefault(); }
    else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(pages.length-1); }
    else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();} else {document.exitFullscreen&&document.exitFullscreen();} }
    else if(e.key==='p'||e.key==='P'){ toggle(); }
    else if(e.key==='Escape'){ toggle(false); }
  });
  var z1=document.getElementById('zprev'), z2=document.getElementById('znext');
  if(z1) z1.addEventListener('click',function(){ show(i-1); });
  if(z2) z2.addEventListener('click',function(){ show(i+1); });
  var x0=null;
  document.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null) return; var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>50){ show(dx<0?i+1:i-1); } x0=null;
  },{passive:true});
  window.addEventListener('resize',fit); fit(); show(i);
})();
</script>
</body>
</html>
