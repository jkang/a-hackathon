# =============================================================================
# opportunity-definition · YAML data contract (source of truth)
# Purpose: turn a focused opportunity (from the selected insights) into a
#   structured definition — 5 elements (one-liner / segment & scenario / pain /
#   solution hypothesis / value) + a 4-row value-breakdown table.
# This file is the single contract between the LLM output and the HTML compiler.
# Replace the sample below with your campaign's opportunity.
# =============================================================================

meta:
  title: "{Campaign} · Opportunity Definition"
  sectionNo: "3.1"
  version: "v1.0"
  date: "2026-09-28"
  business: "{client / brand}"
  domain: "{business area — e.g. ticketing / membership / IP}"
  scenario: "{scenario name}"
  insightRef: "answers selected key insight(s) {n} from the insight gate"
  opportunitySource: "{where this opportunity came from}"

# ---- opportunities ----
opportunities:
  - id: "OP1"
    order: 1
    name: "{opportunity name}"
    type: "innovation"                       # repetitive / cognitive / longtail / innovation
    capabilityMatch: "{the capability this leans on}"
    e1: "One line — for whom + what we do + to achieve what ('move X from … to …')."
    e2: "Segment: {target segment}.\nScenario: {typical when/where trigger}."
    e3: "The specific pain / tension this answers (traces to the selected insight)."
    e4: "Solution hypothesis — what we do + the main risk/guardrail (what could go wrong, how we contain it)."
    e5: "Value / return — directional but quantifiable."
    valueBreakdown:
      - dimension: "Scope"
        aligns: "which markets / segments / channels"
        metric: "{…}"
      - dimension: "Frequency"
        aligns: "how often × volume"
        metric: "{…}"
      - dimension: "Per-instance value"
        aligns: "the gain per occurrence"
        metric: "{…}"
      - dimension: "Cumulative impact"
        aligns: "the KPI it moves at scale"
        metric: "{…} [inference where assumed]"
