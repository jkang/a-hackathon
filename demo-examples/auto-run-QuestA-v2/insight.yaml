# Quest A · INSIGHT — runner auto-run (autopilot)
# Research: live via agent-reach (Exa + Jina). Data as of 2026-09-29.
quest: A
client: "OCA — Doha 2030 Ticketing & Fan Engagement Unit"
mission: "Make Asia Doha's biggest 'away crowd' in Asian Games history."
scope_note: "Card = Asia-wide. The MVP pilot runs in 2 priority Asian markets (Indonesia + Thailand); China is the phase-2 beachhead."
org_profile:
  assets:
    - "Visa-free entry for China, Indonesia, Singapore, Thailand (30 days) and Malaysia (90 days)"
    - "Qatar Airways + Hamad Int'l hub (35M pax in 2022 -> 58-60M capacity; 170+ destinations winter 2026-27)"
    - "World-Cup-proven venues, hotel stock and airlift (Qatar 2022: ~130K peak hotel capacity)"
    - "39 venues / 54 sports; National Vision 2030 tourism target (6M visitors/yr, QAR 34B spend)"
    - "18-month runway (May 2029 - Oct 2030) + national-tourism backing"
  constraints:
    - "MVP budget USD 1.5M (5% of the USD 30M war chest)"
    - "Asia's away crowd has never been activated by an Asian Games host"
    - "DATE RISK: OCA proposes moving the Asian Games to the year before the Olympics, i.e. Doha 2030 -> 2031 (Xinhua, 2026-04-27)"
benchmark:
  gold_standard: "Hangzhou 2022/23 — 3.05M tickets, RMB 610M (~USD 83.5M) ticket revenue, ~90% attendance (92% live), RMB 5.316B (~USD 728M) market development, RMB 700M licensed merch (mascots = 70%)."
  cautionary_tale: "Aichi-Nagoya 2026 — planned 2.75M tickets, only ~700-800K sold by late Aug; <60% sold for 8 big-stadium sports (incl. football, baseball, hockey) while badminton/fencing topped 90%; empty seats even where 'sold out'."
  arena: "Doha 2030 — 4-19 Nov 2030, Khalifa Int'l Stadium; Qatar is visa-free for CN/ID/TH/MY/SG but NOT PH/VN (Hayya e-visa from QAR 100)."
market:
  trends:
    - {trend: "Asia outbound is at an all-time high", why_it_matters: "Thailand 13.06M outbound in 2025 (+11.4%, record; spend +29.5%); Indonesia 8.95M in 2024 (+19.0%) — the demand engine exists."}
    - {trend: "Asia is the world's most mobile-first fan base", why_it_matters: "TikTok 460M MAU in our first Asian markets (Indonesia 160M, Vietnam 70M, Thailand 50M); 74% of Asia adults are football fans."}
    - {trend: "Doha has already proved it can host the world", why_it_matters: "Qatar 2022: 1.4M international visitors, 3.18M tickets sold, 96.3% attendance — venue + airlift de-risked."}
  truths:
    - {author: "Auto-run (agent-reach)", text: "Demand does not appear by itself — Nagoya planned 2.75M tickets and sold under 30%."}
    - {author: "Auto-run (agent-reach)", text: "Asian fans book as crews and families; the trip is a group decision, not a solo one."}
    - {author: "Auto-run (agent-reach)", text: "Visa-free status, not desire, decides which markets can actually travel."}
segments:
  - {name: "The Away Crew", who: "Asia Gen-Z & young Millennials, 18-32, football- and short-video-first (ID/TH/VN)", job_functional: "see a live Asian Games", job_social: "travel with my crew and be seen", job_emotional: "belong to a national moment", barrier: "cost + who-to-go-with", trigger: "a creator my crew trusts films the away end"}
  - {name: "The Family Stand", who: "Asian families, school-holiday travellers", job_functional: "a once-in-a-decade family trip", job_social: "give the kids a story", job_emotional: "safe, proud, shared memory", barrier: "Nov timing unknown + visa/hotel confidence", trigger: "cool-season + visa-free + a family bundle"}
  - {name: "The Gulf Crew", who: "Asian diaspora working across the Gulf (Qatar/UAE/KSA)", job_functional: "see my nation play, close to home", job_social: "lead the away section", job_emotional: "national pride + belonging", barrier: "time off + ticket access", trigger: "team draw + crew invite"}
moment_of_truth: {when: "ticket-sale day / the creator-film drop", where: "phone — TikTok / IG creator feed", event: "a trusted creator films the away end and invites the crew"}
clusters:
  - {theme: "Demand exists", items: ["outbound records", "74% football fandom", "China-Gulf warming"]}
  - {theme: "Distribution = creators", items: ["460M TikTok MAU", "creator trust > ads", "short-video discovery"]}
  - {theme: "Friction = logistics", items: ["visa map", "cost", "who-to-go-with"]}
swot:
  strengths: ["Visa-free + Qatar Airways hub for most target markets", "World-Cup-proven venues, hotels, airlift", "18-month runway + national-tourism backing"]
  weaknesses: ["Asia never activated by a Games host", "No existing fan pipeline or membership", "USD 1.5M pilot vs 6 Asian markets"]
  opportunities: ["Asia outbound records + China-Gulf warming", "460M TikTok MAU + creator trust", "Nagoya left Asia unmined; Nov cool season"]
  threats: ["Doha 2030 -> 2031 date risk", "Nagoya-style under-demand if we spread thin", "PH/VN not visa-free — excluded from paid push"]
key_insights:
  - {id: 1, text: "Asia outbound is at a record high, but no Games host has ever aimed it at Doha.", evidence: "Thailand 13.06M outbound in 2025 (+11.4%, all-time high); Indonesia 8.95M in 2024 (+19.0%).", source: "Nation Thailand 2026; BPS/statbase 2025"}
  - {id: 2, text: "Demand must be manufactured — and it fails by sport: Nagoya sold under 60% for big-stadium sports while badminton topped 90%.", evidence: "Aichi-Nagoya 2026: <60% sold for 8 sports incl. football/baseball/hockey (Kyodo 2026-09-25).", source: "Kyodo News 2026-09-25"}
  - {id: 3, text: "Asia is the most mobile-first, creator-trusting fan base on earth — 460M TikTok MAU and 74% football fandom.", evidence: "TikTok 460M MAU in Asia (ID 160M, VN 70M, TH 50M), 2025; 74% of Asia adults are football fans.", source: "TikTok Newsroom 2025; Nielsen via Zakgt 2025"}
  - {id: 4, text: "Qatar's visa-free map — not desire — decides the addressable market: CN/ID/TH/MY/SG are in; PH/VN need a Hayya e-visa.", evidence: "Qatar visa policy 2026: visa-free 30-90 days for CN/ID/SG/TH/MY; PH/VN not visa-free.", source: "Visit Qatar 2026; Wikipedia visa policy of Qatar 2026-08"}
  - {id: 5, text: "Doha already proved it can fill a stadium with the world — 96.3% attendance at Qatar 2022.", evidence: "FIFA World Cup 2022: 3,182,406 tickets, 96.3% attendance, 1.4M international visitors.", source: "FIFA Annual Report 2022; Gulf Business 2022"}
  - {id: 6, text: "Belonging beats browsing: paid supporter clubs and early group booking convert fandom into ticket priority.", evidence: "England Supporters Travel Club gives members priority away/tournament allocation; most group trips are planned >6 months out.", source: "englandfootball.com; worldmetrics 2026"}
selected_insights: [1, 2, 3]
seed_insight: "Doha's biggest away crowd won't be bought with ads — it will be recruited, crew by crew, by the creators Asian fans already trust."
