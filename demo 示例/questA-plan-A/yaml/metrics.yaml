# Quest A · Plan A · PROVE gate capture
# Human-led, AI-scaffolded. Metrics and thresholds chosen by the team; benchmark-defended.
quest: A
plan: "Plan A — THE AWAY CROWD"
victory_conditions:
  - "400K tickets sold to SEA-based fans (~15% of inventory)"
  - "≥85% avg attendance in SEA-team sessions"
  - "250K SEA visitors in Qatar during Games week"
  - "$40M merch + hospitality revenue from SEA fans"
  - "500M social impressions across 6 SEA markets"
metrics:
  - name: "Ticket-hold conversion rate"
    formula: "ticket holds / qualified site visits"
    benchmark_ref: "Nagoya reached only 22% sold at T-14 — late, unorganised demand"
    target: "2.0%"
    threshold_go: ">=1.6%"
    threshold_no_go: "<0.8%"
  - name: "CAC per ticket hold"
    formula: "media + creator spend / ticket holds"
    benchmark_ref: "Hangzhou ¥610M ticket revenue on 3.05M tickets (~¥200 avg) — yield sanity check"
    target: "<=$12"
    threshold_go: "<=$15"
    threshold_no_go: ">$25"
  - name: "Crew share of holds"
    formula: "holds in groups of 4+ / total holds"
    benchmark_ref: "Team field truth: SEA fans already charter away trips (AFF culture) — crew is the product"
    target: "45%"
    threshold_go: ">=35%"
    threshold_no_go: "<20%"
  - name: "Crew Pass bundle attach rate"
    formula: "flight+ticket+stay bundles / paid tickets"
    benchmark_ref: "Hangzhou merch attach: mascot = 70% of ¥760M licensed merch"
    target: "25%"
    threshold_go: ">=20%"
    threshold_no_go: "<10%"
  - name: "Pilot qualified reach (90 days)"
    formula: "sum of campaign impressions, ID + PH"
    benchmark_ref: "Full-scale goal: 500M impressions across 6 SEA markets — pilot must prove ~10%+"
    target: "60M"
    threshold_go: ">=50M"
    threshold_no_go: "<30M"
