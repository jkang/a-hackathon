  week1: {conversion: "0.9%", cac: "$19.0", reach: "9M",  crew: "28%", bundle: "9%"}
  week2: {conversion: "1.4%", cac: "$16.2", reach: "18M", crew: "33%", bundle: "13%"}
  week3: {conversion: "1.8%", cac: "$14.1", reach: "27M", crew: "38%", bundle: "17%"}
  week4: {conversion: "2.1%", cac: "$12.6", reach: "38M", crew: "42%", bundle: "20%"}
  week5: {conversion: "2.3%", cac: "$11.5", reach: "48M", crew: "44%", bundle: "22%"}
  week6: {conversion: "2.5%", cac: "$10.8", reach: "58M", crew: "46%", bundle: "24%"}
pilot_funnel:
  qualified_reach: "58M impressions (ID + PH, 90 days)"
  qualified_visits: "3.0M"
  crew_signups: "150K"
  ticket_holds: "75K"
  paid_tickets: "30K (40% hold-to-paid)"
cost_benefit:
  budget: 1500000
  blended_revenue_per_fan: "USD 105 (ticket $30, Hangzhou-implied avg; + $45 bundle margin; + $30 merch/hospitality attach)"
  projected_return: "USD 5.7M — $3.15M pilot sales (30K × $105) + $2.6M holds pipeline (45K open holds × 55% expected conversion × $105); 150K-member crew registry is further upside"
  roi: "3.8x"
  payback: "<12 months"
  unlock_verdict: "GO — recommend unlocking the full USD 30M for the 18-month rollout"
go_no_go_rule: "GO if at least 4 of 5 sub-metrics hit their Go threshold and none hits No-Go; otherwise iterate once (6-week fix window) or stop."
