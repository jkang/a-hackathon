# Quest A · Plan B "Creator-Led Demand" · PROVE gate capture
# Human-led, AI-scaffolded. Metrics and thresholds chosen by the team; benchmark-defended.
quest: A
victory_conditions:
  - "400K tickets sold to SEA-based fans (~15% of inventory)"
  - "≥85% avg attendance in SEA-team sessions"
  - "250K SEA visitors in Qatar during Games week"
  - "$40M merch + hospitality revenue from SEA fans"
  - "500M social impressions across 6 SEA markets"
metrics:
  - name: "Creator reach (pilot impressions)"
    formula: "sum of Creator Squad post impressions, PH + VN"
    benchmark_ref: "Full-scale goal 500M impressions across 6 SEA markets; Nagoya had no demand engine at all"
    target: "150M"
    threshold_go: "≥120M"
    threshold_no_go: "<70M"
  - name: "Countdown conversion rate"
    formula: "layaway sign-ups (ticket holds) / qualified site visits"
    benchmark_ref: "Nagoya sold only 22% by T-14 — demand was never manufactured"
    target: "3.0%"
    threshold_go: "≥2.5%"
    threshold_no_go: "<1.5%"
  - name: "Layaway completion rate"
    formula: "paid tickets / layaway sign-ups"
    benchmark_ref: "Hangzhou 92% attendance — manufactured demand converts when the on-ramp fits"
    target: "35%"
    threshold_go: "≥30%"
    threshold_no_go: "<18%"
  - name: "CAC per ticket hold"
    formula: "paid spend / ticket holds"
    benchmark_ref: "Hangzhou ¥610M ticket revenue — yield sanity check on acquisition cost"
    target: "≤$10"
    threshold_go: "≤$12"
    threshold_no_go: ">$18"
  - name: "'I Was There' share rate"
    formula: "buyers sharing the badge / paid ticket buyers"
    benchmark_ref: "Hangzhou mascot = 70% of merch sales — identity drives spend"
    target: "25%"
    threshold_go: "≥20%"
    threshold_no_go: "<10%"
